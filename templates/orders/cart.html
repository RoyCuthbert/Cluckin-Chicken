<div class="offcanvas offcanvas-end"
     tabindex="-1"
     id="cartDrawer">

    <div class="offcanvas-header">

        <h5>Your Basket</h5>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas">
        </button>

    </div>

    <div class="offcanvas-body">

        {% if cart_items %}

            {% for cart in cart_items %}

                <div class="border-bottom mb-3 pb-3">

                    <h6>

                        {{ cart.item.name }}

                    </h6>

                    <p>

                        £{{ cart.item.price }}

                    </p>

                    <div class="d-flex align-items-center gap-2">

                        <a href="{% url 'decrease_cart' cart.item.id %}?cart=open"
                           class="btn btn-sm btn-outline-danger">

                            -

                        </a>

                        <span>

                            {{ cart.quantity }}

                        </span>

                        <a href="{% url 'add_to_cart' cart.item.id %}?cart=open"
                           class="btn btn-sm btn-outline-success">

                            +

                        </a>

                    </div>

                    <p class="mt-2">

                        Subtotal:
                        £{{ cart.subtotal }}

                    </p>

                    <a href="{% url 'remove_from_cart' cart.item.id %}?cart=open"
                       class="btn btn-sm btn-danger">

                        Remove

                    </a>

                </div>

            {% endfor %}

            <h5>

                Total: £{{ total_price }}

            </h5>

        {% else %}

            <p>Your basket is empty.</p>

        {% endif %}

    </div>

</div>
