{% extends 'base.html' %}

{% block content %}
<h1 class="text-danger">Menu</h1>

<div class="row">
    {% for item in items %}
    <div class="col-md-4 mb-4">
        <div class="card">
            <img src="{{ item.image.url }}" class="card-img-top">
            <div class="card-body">
                <h5>{{ item.name }}</h5>
                <p>{{ item.description }}</p>
                <strong>£{{ item.price }}</strong>
                <button class="btn btn-warning w-100">Add to Cart</button>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
