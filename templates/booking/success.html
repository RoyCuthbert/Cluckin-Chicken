{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="text-warning fw-bold">
        <h1>Booking Successful!</h1>
        <p>Thank you for your reservation {{booking.name}}.</p>
    </div>
    <div class="card p-4 mx-auto"
         style="max-width:500px;">

        <p>

            <strong>Date:</strong>
            {{ booking.date }}

        </p>

        <p>

            <strong>Time:</strong>
            {{ booking.time }}

        </p>

        <p>

            <strong>Guests:</strong>
            {{ booking.guests }}

        </p>

    </div>

{% endblock %}
