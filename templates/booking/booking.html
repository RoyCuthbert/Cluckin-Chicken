{% extends 'base.html' %}

{% block content %}

<h2 class="text-danger mb-4">

    Book a Table

</h2>

<form method="POST">

    {% csrf_token %}
    <select name="day"
            class="form-control mb-2"
            required>

    <option value="Monday"
        {% if selected_day == "Monday" %}selected{% endif %}>
        Monday
    </option>

    <option value="Tuesday"
        {% if selected_day == "Tuesday" %}selected{% endif %}>
        Tuesday
    </option>

    <option value="Wednesday"
        {% if selected_day == "Wednesday" %}selected{% endif %}>
        Wednesday
    </option>

    <option value="Thursday"
        {% if selected_day == "Thursday" %}selected{% endif %}>
        Thursday
    </option>

    <option value="Friday"
        {% if selected_day == "Friday" %}selected{% endif %}>
        Friday
    </option>

    <option value="Saturday"
        {% if selected_day == "Saturday" %}selected{% endif %}>
        Saturday
    </option>

    <option value="Sunday"
        {% if selected_day == "Sunday" %}selected{% endif %}>
        Sunday
    </option>

    </select>

    <input type="date"
           name="date"
           class="form-control mb-2"
           value="{{ selected_date }}"
           required>

    <input type="number"
           name="guests"
           class="form-control mb-3"
           placeholder="Guests"
           value="{{ guests }}"
           required>

    <!-- CHECK TIMES BUTTON -->

    <button type="submit"
            class="btn btn-dark w-100 mb-3">

        Check Available Times

    </button>

    <!-- TIMESLOTS -->

    {% if available_slots %}

    <div class="card p-3 shadow-sm mb-3">
        <input type="text"
           name="name"
           class="form-control mb-2"
           placeholder="Full Name"
           required>

        <input type="email"
           name="email"
           class="form-control mb-2"
           placeholder="Email"
           required>

        <h5 class="mb-3">

            Available Times

        </h5>

        <select name="time"
                class="form-control mb-3"
                required>

            {% for slot in available_slots %}

            <option value="{{ slot }}">

                {{ slot }}

            </option>

            {% endfor %}

        </select>

        <button type="submit"
                name="confirm_booking"
                value="1"
                class="btn btn-danger w-100">

            Confirm Booking

        </button>

    </div>

    {% endif %}

</form>

{% endblock %}
